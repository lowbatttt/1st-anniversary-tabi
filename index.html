    <script>
    (function() {
        var canvas = $('#canvas');
		
        if (!canvas[0].getContext) {
            $("#error").show();
            return false;
        }

        var width = canvas.width();
        var height = canvas.height();        
        canvas.attr("width", width);
        canvas.attr("height", height);

        var opts = {
            seed: {
                x: width / 2 - 20,
                scale: 2
            },
            branch: [
                [535, 680, 570, 250, 500, 200, 30, 100, [
                    [540, 500, 455, 417, 340, 400, 13, 100, [
                        [450, 435, 434, 430, 394, 395, 2, 40]
                    ]],
                    [550, 445, 600, 356, 680, 345, 12, 100, [
                        [578, 400, 648, 409, 661, 426, 3, 80]
                    ]],
                    [539, 281, 537, 248, 534, 217, 3, 40],
                    [546, 397, 413, 247, 328, 244, 9, 80, [
                        [427, 286, 383, 253, 371, 205, 2, 40],
                        [498, 345, 435, 315, 395, 330, 4, 60]
                    ]],
                    [546, 357, 608, 252, 678, 221, 6, 100, [
                        [590, 293, 646, 277, 648, 271, 2, 80]
                    ]]
                ]] 
            ],
            bloom: {
                num: 1700,
                width: 1080,
                height: 650,
            },
            footer: {
                width: 1100,
                height: 5,
                speed: 10,
            }
        }

        var tree = new Tree(canvas[0], width, height, opts);
        var seed = tree.seed;
        var foot = tree.footer;
        var hold = 1;

        canvas.click(function(e) {
        var offset = canvas.offset(), x, y;
        x = e.pageX - offset.left;
        y = e.pageY - offset.top;
        if (seed.hover(x, y)) {
                playAudio();
                hold = 0;
                canvas.unbind("click");
                canvas.unbind("mousemove");
                canvas.removeClass('hand');

                runAsync().start();           // 🌳 mulai animasi pohon
                cycleBackgroundsStopAtLast(); // 🌄 background mulai berganti
                textAnimate().start();        // teks ketik mulai
        } 
        else {
            // klik di luar seed tidak melakukan apa pun
            console.log("Klik di luar seed, tidak terjadi apa-apa.");
        }

        }).mousemove(function(e) {
            var offset = canvas.offset(), x, y;
            x = e.pageX - offset.left;
            y = e.pageY - offset.top;
            canvas.toggleClass('hand', seed.hover(x, y));
        });

        var seedAnimate = eval(Jscex.compile("async", function () {
            seed.draw();
            while (hold) {
                $await(Jscex.Async.sleep(10));
            }
            while (seed.canScale()) {
                seed.scale(0.95);
                $await(Jscex.Async.sleep(10));
            }
            while (seed.canMove()) {
                seed.move(0, 3.5);
                foot.draw();
                $await(Jscex.Async.sleep(10));
            }
        }));

        var growAnimate = eval(Jscex.compile("async", function () {
            do {
                tree.grow();
                $await(Jscex.Async.sleep(7));
            } while (tree.canGrow());
        }));

        var flowAnimate = eval(Jscex.compile("async", function () {
            do {
                tree.flower(10);
                $await(Jscex.Async.sleep(10));
            } while (tree.canFlower());
        }));

        var moveAnimate = eval(Jscex.compile("async", function () {
            tree.snapshot("p1", 240, 0, 610, 680);
            while (tree.move("p1", 500, 0)) {
                foot.draw();
                $await(Jscex.Async.sleep(10));
            }
            foot.draw();
            tree.snapshot("p2", 500, 0, 610, 680);

            canvas.parent().css("background", "url(" + tree.toDataURL('image/png') + ")");
            $await(Jscex.Async.sleep(300));
            canvas.css("background", "none");
        }));

        // 🌱 FUNGSI BARU: hanya untuk menampilkan seed saat halaman dibuka
        function drawSeedOnly() {
            seed.draw(); // menggambar benih tanpa menjalankan animasi
        }
        
        var runAsync = eval(Jscex.compile("async", function () {
            $await(seedAnimate());
            $await(growAnimate());
            $await(flowAnimate());
            $await(moveAnimate());
            $await(typeText("typedText", [
                "Ada sebuah cerita,",
                "Tentang sebuah objek abstrak yang turun ke Bumi,",
                "Tanpa identitas, tanpa perasaan, ia tak mengerti mengapa ia hadir di dunia ini,"
            ], 55, 550));

            $await(Jscex.Async.sleep(10300)); // jeda 1 detik
            $("#typedText2"). fadeIn(100); // munculkan div dengan efek halus
            $await(typeText("typedText2", [

                "Ia berkelana untuk belajar banyak hal baru dan mencari makna dari keberadaannya,",
                "Benar, pengelana itu bernama..."
            ], 55, 550));

            // 🕓 Setelah teks kedua selesai
            $await(Jscex.Async.sleep(11800)); // tunggu 1 detik

            // Hapus semua teks (fade out)
            $("#typedText, #typedText2").fadeOut(1500);
            $await(Jscex.Async.sleep(2000)); // tunggu sampai fade out selesai

            // 🌟 Munculkan teks ke-3 (langsung fade in, tanpa animasi ketik)
            // 🌟 Fade in teks ke-3
            $("#typedText3")
                .text("TABI NOJI")
                .css("display", "block")
                .animate({ opacity: 1 }, 3000); // durasi 3 detik

            // ⏳ Tunggu fade-in selesai (3 detik) + jeda 2 detik tambahan sebelum Tabi muncul
            $await(Jscex.Async.sleep(4000));

            // 🌸 Setelah itu baru tampil animasi Tabi
            mulaiAnimasiTabi();
        }));


        // 🌱 Gambar seed saat halaman dibuka
        drawSeedOnly();

    tabiHalo.style.display  = "none";

    // 🌟 Tahap 1 — TABI JALAN MASUK dari kiri ke 1/10 kanvas

    tabiJalan.style.display = "block";
    tabiJalan.style.opacity = "1";
    tabiJalan.style.transform = "scaleX(-1)"; // menghadap kanan

    tabiJalan.animate([
        { left: posisiMasuk + "px" },
        { left: posisiBerhenti + "px" }
    ], {
        duration: durasiMasuk,
        easing: "linear",
        fill: "forwards"
    });

            tabiJalan.style.display = "block";

            tabiJalan.style.transform = "scaleX(1)"; // 🔁 balik arah (mirror terhadap sumbu Y)
            tabiJalan.style.opacity = "1";

            tabiJalan.animate([
                { left: posisiBerhenti + "px" },
                { left: posisiKeluarKiri + "px" }

                                        transform: "scaleX(1)" // tetap di belakang kucing
                                    });

                                    kucing.animate({ right: canvasWidth + 200 }, {
                                        duration: durasiLari,
                                        easing: "linear",
                                        complete: function() { $(this).hide(); }
                                    });
                                    setTimeout(() => {
                                        tabi.animate({ right: canvasWidth + 100 }, {
                                            duration: durasiLari,
                                            easing: "linear",
                                            complete: function() { $(this).hide(); }
                                        });
                                    }, 700);
                                }, (durasiLari + 500) * 2); // dijadwalkan setelah gerakan kedua selesai
                                setTimeout(() => {
                                    kucing.stop(true, true).css({
                                        display: "block",
                                        left: "-180px",
                                        right: "auto",
                                        transform: "scaleX(-1)" // menghadap kiri (masuk dari kanan)
                                    });
                                    tabi.stop(true, true).css({
                                        display: "block",
                                        left: "-250px",
                                        right: "auto",
                                        transform: "scaleX(-1)" // tetap di belakang kucing
                                    });

                                    kucing.animate({ left: canvasWidth + 200 }, {
                                        duration: durasiLari,
                                        easing: "linear",
                                        complete: function() { $(this).hide(); }
                                    });
                                    setTimeout(() => {
                                        tabi.animate({ left: canvasWidth + 100 }, {
                                            duration: durasiLari,
                                            easing: "linear",
                                            complete: function() { $(this).hide(); }
                                        });
                                    }, 700);
                                }, (durasiLari + 500) * 3);
                            }, 2000); // 2 DETIK SETELAH TEKS 6 MULAI
                        }, 4000); // 2 detik fade + 2 detik jeda
                    }, 13000); // 11 detik teks4 + 3 detik jeda teks5
                }, 11000);
            }, 5000);
        }, durasiKeluar + 200);

        }, durasiHalo);

    }, durasiMasuk);
}

        let currentBg = 0;

        // fungsi untuk ganti background
        function setBackground(index) {
        document.body.style.backgroundImage = "url('" + backgrounds[index].src + "')";
        document.body.style.backgroundSize = "cover";
        document.body.style.backgroundRepeat = "no-repeat";
        document.body.style.transition = "background-image 1s ease-in-out";
        }

        // fungsi utama untuk ganti otomatis tanpa looping
        function cycleBackgroundsStopAtLast() {
            if (currentBg >= backgrounds.length) return;

            setBackground(currentBg);

            if (currentBg < backgrounds.length - 1) {
                setTimeout(() => {
                currentBg++;
                cycleBackgroundsStopAtLast(); // panggil lagi
                }, backgrounds[currentBg].duration);
            }
        }

        // 🌅 Background awal (pagi) saat web pertama kali dibuka
        window.addEventListener("load", () => {
        document.body.style.backgroundImage = "url('pagi.png')";
        document.body.style.backgroundSize = "cover";
        document.body.style.backgroundRepeat = "no-repeat";
        document.body.style.transition = "background-image 1s ease-in-out";
        });
        })();
